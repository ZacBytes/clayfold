name: Attach npm package to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to package
        type: string
        required: true

concurrency:
  group: release-package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Build and verify the package
        run: |
          source="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git fetch --depth=1 --no-tags origin "refs/tags/$RELEASE_TAG"
            source=FETCH_HEAD
          fi
          package_dir=$(mktemp -d "$RUNNER_TEMP/clayfold-package.XXXXXX")
          git archive "$source" README.md ARTWORK-LICENSE.md catalog.json ':(glob)assets/*.webp' |
            tar -x -C "$package_dir"
          # Earlier icon releases predate the npm manifest.
          if ! git show "$source:package.json" > "$package_dir/package.json" 2>/dev/null; then
            cp package.json "$package_dir/package.json"
            cp -R integrations "$package_dir/integrations"
          elif git cat-file -e "$source:integrations"; then
            git archive "$source" integrations | tar -x -C "$package_dir"
          fi
          cd "$package_dir"

          version=${RELEASE_TAG#npm-}
          version=${version#v}
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            npm version "$version" --no-git-tag-version --allow-same-version --ignore-scripts
          fi
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node --input-type=commonjs - "$RUNNER_TEMP/pack.json" <<'JS'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const [pack] = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const { icons } = require("./catalog.json");
          const expected = ["ARTWORK-LICENSE.md", "README.md", "catalog.json", "package.json",
            ...icons.map(({ id }) => `assets/${id}.webp`)];
          if (fs.existsSync("integrations")) {
            expected.push(...fs.readdirSync("integrations").map(file => `integrations/${file}`));
          }
          assert.deepEqual(pack.files.map(file => file.path).sort(), expected.sort());
          const tarball = path.join(process.env.RUNNER_TEMP, pack.filename);
          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_TARBALL=${tarball}\n`);
          console.log(`Verified ${pack.name}@${pack.version} with ${icons.length} WebP icons.`);
          JS
      - name: Attach archive to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          asset_name=$(basename "$NPM_TARBALL")
          if grep -Fxq -- "$asset_name" <<< "$assets"; then
            printf '%s is already attached to %s.\n' "$asset_name" "$RELEASE_TAG"
          else
            gh release upload "$RELEASE_TAG" "$NPM_TARBALL" --repo "$GITHUB_REPOSITORY"
          fi
