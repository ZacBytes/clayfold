name: Clayfold npm release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this package version to npm
        type: boolean
        default: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Build and verify the package
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/pack.json"
          node --input-type=commonjs - "$RUNNER_TEMP/pack.json" <<'JS'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const [pack] = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const { icons } = require("./catalog.json");
          const expected = ["ARTWORK-LICENSE.md", "README.md", "catalog.json", "package.json",
            ...icons.map(({ id }) => `assets/${id}.webp`)];
          assert.deepEqual(pack.files.map(file => file.path).sort(), expected.sort());
          const tarball = path.join(process.env.RUNNER_TEMP, pack.filename);
          fs.appendFileSync(process.env.GITHUB_ENV, `NPM_TARBALL=${tarball}\n`);
          console.log(`Verified ${pack.name}@${pack.version} with ${icons.length} WebP icons.`);
          JS
      - name: Publish to npm
        if: inputs.publish && github.ref == 'refs/heads/main'
        run: npm publish "$NPM_TARBALL" --access public --ignore-scripts
