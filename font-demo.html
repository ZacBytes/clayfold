<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Select any Clayfold icons and download a custom color icon font ZIP with browser-ready fonts, CSS and a map of icon names.">
  <meta name="theme-color" content="#f7f6f0">
  <title>Custom Color Icon Font Builder · Clayfold</title>
  <link rel="canonical" href="https://zacbytes.github.io/clayfold/font-demo.html">
  <link rel="describedby" href="./llms.txt">
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon">
  <link rel="icon" href="./brand/favicon.png" sizes="96x96" type="image/png">
  <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png" sizes="180x180">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Clayfold">
  <meta property="og:title" content="Custom Color Icon Font Builder · Clayfold">
  <meta property="og:description" content="Pick Clayfold icons and download a custom color icon font for your app.">
  <meta property="og:url" content="https://zacbytes.github.io/clayfold/font-demo.html">
  <meta property="og:image" content="https://zacbytes.github.io/clayfold/brand/social-card.png">
  <meta property="og:image:alt" content="Clayfold’s clay-style cargo ship, bookmark and coffee cup icons.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="./fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/font-builder.mjs"></script>
</head>
<body>
  <header class="top"><div class="wrap top-inner">
    <a class="brand" href="./"><img src="./assets/star.webp" width="32" height="32" alt=""><span>Clayfold</span></a>
    <a class="browse-link" href="./#catalog">Icon catalog</a>
  </div></header>
  <main class="wrap font-builder">
    <h1>Icon font builder</h1>
    <p>Build a color font with just the icons your project uses.</p>

    <div class="font-layout">
      <aside class="font-selection" aria-labelledby="selection-title">
        <div class="font-selection-header">
          <h2 id="selection-title">Selection</h2>
          <button type="button" id="clear-selected" class="font-text-button" disabled>Clear</button>
        </div>
        <p id="selected-count" aria-live="polite" aria-atomic="true">0 icons selected</p>
        <ul id="selected-icons" class="selected-icons" aria-label="Selected icons" hidden></ul>
        <button type="button" id="export-font" class="button solid" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 16v4h14v-4"/></svg>
          Download font ZIP
        </button>
        <p id="export-status" class="font-status" role="status"></p>
      </aside>

      <section class="font-results" aria-label="Choose icons">
        <div class="font-filters">
          <label class="font-search">
            <span class="sr-only">Search icons</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg>
            <input id="font-query" type="search" placeholder="Search icons…" autocomplete="off" maxlength="180">
          </label>
          <label>
            <span class="sr-only">Category</span>
            <select id="font-category"><option value="">All categories</option></select>
          </label>
        </div>
        <div class="font-results-header">
          <p id="font-count" role="status">Loading icons…</p>
          <button type="button" id="select-results" class="font-text-button" disabled>Select results</button>
        </div>
        <div id="font-grid" class="font-grid" aria-label="Available icons"></div>
        <button type="button" id="more-font-icons" class="button" hidden>Show more icons</button>
        <noscript><p>Enable JavaScript to build a font, or <a href="./#catalog">download individual icons</a> from the catalog.</p></noscript>
      </section>
    </div>
  </main>
</body>
</html>
